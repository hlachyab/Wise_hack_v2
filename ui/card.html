<!doctype html>
<!--
  The Wise card shown inside Claude's chat (MCP Apps).

  How it gets here: src/card.js serves this file as the resource ui://wise/card.html, with each
  __ASSET:file__ placeholder replaced by that file from ui/assets/ as a data URI. Claude Desktop
  renders it in a sandboxed iframe and sends it each tool result's structuredContent.
  The `kind` field picks the layout (see render()):
    balances, recipients, quote, invoices   read results
    payment, batch                          a draft or batch and its status (watch() keeps it live)
    approvals                               what is waiting for the user
    recipient_added                         add_recipient result
    denied                                  a refused call (not connected, revoked, expired, None)

  The card is display-only. It can't approve anything; only the web app can.
  Its buttons only open the Wise app (ui/open-link). While something waits for the user it
  calls the payment_status tool every 2 seconds, so it updates when they approve or decline.
  It must stay a single self-contained file: no network access to localhost from the sandbox.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Wise card</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  /* Tokens + components from the WiseStart Hackathon Figma kit:
     Palette, Typography, Logo, Section Card, Bullet Point, Stepper, Button, money input. */
  :root {
    --bright-green: #9FE870;
    --accent-hover: #80E142;
    --forest: #163300;
    --content-primary: #0E0F0C;
    --content-secondary: #454745;
    --content-tertiary: #6A6C6A;
    --interactive-secondary: #868685;
    --border-soft: rgba(14, 15, 12, 0.12);
    --neutral: rgba(22, 51, 0, 0.08);
    --neutral-strong: rgba(22, 51, 0, 0.14);
    --positive: #2F5711;
    --warning: #EDC843;
    --warning-ink: #5C4A00;
    --warning-soft: rgba(237, 200, 67, 0.28);
    --negative: #A8200D;
    --negative-soft: rgba(168, 32, 13, 0.10);
  }
  * { box-sizing: border-box; }
  /* Transparent page; color-scheme is set to match the host (see setTheme) so the browser
     doesn't paint an opaque square backdrop behind the rounded card. */
  :root { color-scheme: light; }
  html, body { margin: 0; background: transparent; }
  body {
    font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--content-primary);
    -webkit-font-smoothing: antialiased;
    font-size: 14px; line-height: 22px; letter-spacing: 0.01em;
    padding: 4px; /* room so the rounded corners and border are never clipped */
  }

  /* Figma "Section Card": white, 24px radius, 1px rgba(14,15,12,.12) border, 24px padding.
     Always the light Figma palette, so text stays readable in light and dark Claude. */
  .card { background: #F3F4F3; border-radius: 32px; padding: 10px 24px 24px; max-width: 560px; overflow: hidden; }
  /* Coloured top band, like the account cards on the Wise home screen ("Your card", "Jar"). */
  .band { margin: 0 -14px 24px; height: 64px; border-radius: 24px 24px 0 0; padding: 0 20px 0 22px; display: flex; align-items: center; justify-content: space-between; gap: 12px; background: #C1E695; color: var(--forest); }
  .band.yellow { background: #FCEC7D; }
  .band.red { background: #F6D6D0; }
  .band.grey { background: #E8EBE7; }
  .band-label { font-weight: 700; font-size: 15px; }

    .brand { display: flex; align-items: center; gap: 10px; }
  .logo { height: 20px; width: auto; display: block; }
  .logo.lime { display: none; }
  .chip { display: inline-flex; align-items: center; height: 28px; padding: 0 12px; border-radius: 100px; background: rgba(255, 255, 255, 0.6); color: var(--forest); font-weight: 600; font-size: 13px; white-space: nowrap; }
  .mock { font-size: 12px; color: var(--content-tertiary); text-align: center; margin-top: 16px; }

  /* Hero */
  .eyebrow { color: var(--content-secondary); margin-bottom: 4px; }
  .hero { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .amount { font-size: 36px; line-height: 42px; font-weight: 700; letter-spacing: -0.03em; }
  .amount .ccy { font-size: 18px; font-weight: 600; letter-spacing: 0; margin-left: 4px; color: var(--content-secondary); }
  .sub-eur { color: var(--content-secondary); margin-top: 2px; }
  .status { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 14px; border-radius: 100px; font-weight: 600; font-size: 14px; white-space: nowrap; }
  .status.ok { background: var(--bright-green); color: var(--forest); }
  .status.wait { background: var(--warning-soft); color: var(--warning-ink); }
  .status.no { background: var(--negative-soft); color: var(--negative); }
  .pulse { width: 8px; height: 8px; border-radius: 50%; background: currentColor; animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity: .25; } }

  /* Recipient row */
  .row { display: flex; align-items: center; gap: 16px; margin-top: 20px; }
  .avatar { position: relative; width: 48px; height: 48px; border-radius: 50%; background: #FFFFFF; display: grid; place-items: center; font-weight: 600; font-size: 16px; flex-shrink: 0; }
  .avatar .badge { position: absolute; right: -4px; bottom: -4px; width: 18px; height: 18px; border-radius: 50%; box-shadow: 0 0 0 2px var(--badge-ring, #fff); }
  .flag { width: 24px; height: 24px; border-radius: 50%; display: block; flex-shrink: 0; box-shadow: 0 0 0 1px var(--border-soft); }
  .row .meta { min-width: 0; flex: 1; }
  .row b { display: block; font-size: 16px; line-height: 24px; font-weight: 600; }
  .row small { display: block; color: var(--content-secondary); font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* Stepper (Figma "Stepper": 2px track, lime→forest progress, 8px dot, labels below) */
  .stepper { position: relative; margin: 28px 4px 4px; }
  .track { position: relative; height: 2px; background: var(--neutral-strong); border-radius: 100px; }
  .progress { position: absolute; left: 0; top: 0; height: 2px; border-radius: 100px 0 0 100px; background: url("__ASSET:progress-bar.png__") left / 100% 100% no-repeat, linear-gradient(90deg, #9FE870, #163300); }
  .progress.fail { background: var(--negative); }
  .dot { position: absolute; top: 50%; width: 8px; height: 8px; transform: translate(-50%, -50%); }
  .dot.fail { border-radius: 50%; background: var(--negative); }
  .labels { display: flex; justify-content: space-between; margin-top: 10px; }
  .labels span { font-size: 14px; line-height: 22px; color: var(--content-secondary); opacity: .45; white-space: nowrap; }
  .labels span.done { opacity: 1; font-weight: 600; }
  .labels span.current { opacity: 1; font-weight: 600; color: var(--content-primary); }
  .labels span.fail { opacity: 1; font-weight: 600; color: var(--negative); }

  /* Bullet Point (Figma: 20px icon, Body large) */
  .bullets { margin-top: 20px; }
  .bullet { display: flex; gap: 8px; align-items: flex-start; padding: 8px 0; }
  .bullet img { width: 20px; height: 20px; margin-top: 2px; flex-shrink: 0; }
  .bullet p { margin: 0; font-size: 15px; line-height: 24px; color: var(--content-secondary); }
  .bullet p strong { color: var(--positive); font-weight: 600; }
  .bullet.neg p strong { color: var(--negative); }
  .bullet .warn-icon { width: 20px; height: 20px; margin-top: 2px; border-radius: 50%; background: var(--warning); color: #3A341C; display: grid; place-items: center; font-weight: 800; font-size: 13px; flex-shrink: 0; }

  .rule { display: inline-block; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; line-height: 16px; padding: 4px 10px; border-radius: 100px; background: #FFFFFF; color: var(--content-secondary); margin-top: 8px; }

  /* Button (Figma: 48px pill, bright green, Inter SemiBold 14) */
  .btn { display: flex; align-items: center; justify-content: center; width: 100%; height: 48px; border: 0; border-radius: 50px; background: var(--bright-green); color: var(--forest); font: inherit; font-weight: 600; font-size: 14px; letter-spacing: 0.0125em; cursor: pointer; margin-top: 20px; }
  .btn:hover { background: var(--accent-hover); }
  .btn:disabled { opacity: .6; cursor: default; }
  .foot { color: var(--content-tertiary); font-size: 12px; line-height: 18px; margin-top: 12px; text-align: center; }

  /* Balances / quote */
  .title-sub { font-size: 24px; line-height: 30px; font-weight: 700; letter-spacing: -0.015em; margin: 0 0 16px; }
  .label { color: var(--content-secondary); margin-bottom: 8px; }
  .bal { background: #FFFFFF; border-radius: 16px; height: 56px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .ccy-row { display: flex; align-items: center; gap: 8px; font-size: 16px; line-height: 24px; }
  .ccy-dot { width: 24px; height: 24px; border-radius: 50%; background: var(--forest); color: var(--bright-green); display: grid; place-items: center; font-size: 12px; font-weight: 700; flex-shrink: 0; }
  .bal .amt { font-size: 16px; font-weight: 600; }
  .total { display: flex; justify-content: space-between; color: var(--content-secondary); margin-top: 12px; }
  .total b { color: var(--content-primary); }
  .money { background: #FFFFFF; border-radius: 16px; min-height: 64px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .money .amt { font-size: 18px; font-weight: 600; line-height: 24px; letter-spacing: -0.01em; }
  .fee { display: flex; align-items: center; justify-content: space-between; margin: 12px 0; }
  .fee .left { display: flex; align-items: center; gap: 16px; font-weight: 600; }
  .fee img { width: 24px; height: 24px; display: block; }
  .fee .link { color: var(--forest); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }
  .indent { margin-left: 40px; }

  .skeleton { color: var(--content-secondary); display: flex; align-items: center; gap: 8px; }
  /* Claude + Wise icons on the connect card */
  .pair { display: flex; justify-content: center; margin: 4px 0 16px; }
  .pair > img, .pair > span { width: 56px; height: 56px; border-radius: 50%; object-fit: cover; }
  .pair > img { position: relative; z-index: 1; margin-right: -10px; transform: scale(1); }
  .pair > span { background: #9FE870; display: grid; place-items: center; }
  .pair > span img { width: 26px; height: 26px; }

  /* Fallbacks if the host sandbox blocks embedded images */
  .wordmark { font-weight: 700; font-size: 20px; line-height: 20px; letter-spacing: -0.04em; color: var(--forest); }
  .glyph { width: 20px; height: 20px; margin-top: 2px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 800; color: #fff; flex-shrink: 0; }
  .glyph.pos { background: #2F5711; }
  .glyph.neg { background: #A8200D; }
  .glyph.minus { width: 24px; height: 24px; margin: 0; background: var(--neutral-strong); color: var(--content-primary); font-size: 16px; }
  .dot.solid { border-radius: 50%; background: var(--forest); }
</style>
</head>
<body>
<div class="card" id="root"><div class="skeleton" style="padding-top:14px"><span class="pulse"></span> Checking with your Agent Pass…</div></div>
<script>
(() => {
  const WISE_APP_URL = 'http://localhost:4000';
  const ASSETS = {
    logoForest: '__ASSET:wise-logo-forest.svg__',
    pos: '__ASSET:bullet-positive.svg__',
    neg: '__ASSET:bullet-negative.svg__',
    dot: '__ASSET:progress-step.svg__',
    minus: '__ASSET:minus-circle.svg__',
    claude: '__ASSET:claude-icon.png__',
    wiseFlag: '__ASSET:wise-flag.svg__',
  };
  // Flags from the Figma "Flags" section. Empty string = not exported yet → symbol fallback.
  const FLAGS = { EUR: '__ASSET:flag-eu.png__', GBP: '__ASSET:flag-gb.png__', JPY: '__ASSET:flag-jp.png__' };
  const COUNTRY_FLAGS = { EE: '__ASSET:flag-ee.png__', JP: '__ASSET:flag-jp.png__', GB: '__ASSET:flag-gb.png__' };
  const ibanFlag = (iban) => { const m = String(iban || '').match(/^\s*([A-Z]{2})/); return m ? COUNTRY_FLAGS[m[1]] || '' : ''; };
  const RATES_PER_EUR = { EUR: 1, GBP: 0.85, JPY: 162 }; // same mock rates as the server, for the total
  const SYMBOLS = { EUR: '€', GBP: '£', JPY: '¥' };
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const num = (a, c) => {
    const d = c === 'JPY' || Number.isInteger(Number(a)) ? 0 : 2;
    return Number(a).toLocaleString('en-GB', { minimumFractionDigits: d, maximumFractionDigits: d });
  };
  const fmt = (a, c) => (SYMBOLS[c] || '') + num(a, c) + (SYMBOLS[c] ? '' : ' ' + esc(c));
  const initials = (n) => String(n || '?').split(/\s+/).map((w) => w[0]).join('').slice(0, 2).toUpperCase();
  const ccyDot = (c) => FLAGS[c]
    ? `<img class="flag" data-fb="ccy:${esc(c)}" src="${FLAGS[c]}" width="24" height="24" alt="${esc(c)} flag" />`
    : `<span class="ccy-dot">${esc(SYMBOLS[c] || String(c)[0])}</span>`;
  // Avatar with initials + small country flag badge from the IBAN country (Figma Avatar, Flag=True)
  const avatar = (name, iban) => {
    const f = ibanFlag(iban);
    return `<div class="avatar">${esc(initials(name))}${f ? `<img class="badge" data-fb="hide" src="${f}" width="20" height="20" alt="" />` : ''}</div>`;
  };
  const root = document.getElementById('root');

  // If an embedded image can't load (blocked by the host's sandbox, or an asset is missing),
  // swap it for a clean HTML/CSS equivalent instead of showing a broken-image icon.
  const FALLBACK = {
    logo: (img) => `<span class="${img.className} wordmark">Wise</span>`,
    pos: () => '<span class="glyph pos">✓</span>',
    neg: () => '<span class="glyph neg">✕</span>',
    minus: () => '<span class="glyph minus">−</span>',
    dot: (img) => `<span class="dot solid" style="${img.getAttribute('style') || ''}"></span>`,
    hide: () => '',
  };
  document.addEventListener('error', (e) => {
    const img = e.target;
    if (!(img instanceof HTMLImageElement) || !img.dataset.fb) return;
    const kind = img.dataset.fb;
    const html = kind.startsWith('ccy:')
      ? `<span class="ccy-dot">${esc(SYMBOLS[kind.slice(4)] || kind.slice(4, 5))}</span>`
      : (FALLBACK[kind] || FALLBACK.hide)(img);
    img.outerHTML = html;
  }, true);

  // Theme: follow the host, fall back to the OS.
  const mq = window.matchMedia('(prefers-color-scheme: dark)');
  let hostTheme = null;
  // The card itself always uses the light Figma palette (white Section Card). We only mirror the
  // host's color-scheme on the document, so the iframe backdrop stays transparent (no square white box).
  const setTheme = () => {
    const t = hostTheme || (mq.matches ? 'dark' : 'light');
    document.documentElement.dataset.theme = t;
    document.documentElement.style.colorScheme = t;
  };
  mq.addEventListener?.('change', setTheme);
  setTheme();

  // ---- Minimal MCP Apps bridge (JSON-RPC 2.0 over postMessage to the host) ----
  let nextId = 1;
  const pending = new Map();
  let hostCaps = {};
  const send = (msg) => window.parent.postMessage({ jsonrpc: '2.0', ...msg }, '*');
  const request = (method, params) =>
    new Promise((resolve, reject) => {
      const id = nextId++;
      pending.set(id, { resolve, reject });
      send({ id, method, params });
    });
  const notify = (method, params) => send({ method, params });

  window.addEventListener('message', (e) => {
    const m = e.data;
    if (!m || m.jsonrpc !== '2.0') return;
    if (m.id != null && !m.method) {
      const p = pending.get(m.id);
      if (p) { pending.delete(m.id); m.error ? p.reject(m.error) : p.resolve(m.result); }
      return;
    }
    switch (m.method) {
      case 'ui/notifications/tool-input': renderLoading(m.params?.arguments); break;
      case 'ui/notifications/tool-result': render(m.params?.structuredContent, m.params); break;
      case 'ui/notifications/host-context-changed': applyContext(m.params); break;
      case 'ui/notifications/tool-cancelled': root.innerHTML = header() + '<div class="skeleton">Cancelled.</div>'; break;
      default:
        if (m.id != null) send({ id: m.id, result: {} }); // ack requests like ping / resource-teardown
    }
  });
  function applyContext(ctx) { if (ctx?.theme) { hostTheme = ctx.theme; setTheme(); } }

  new ResizeObserver(() => notify('ui/notifications/size-changed', { height: Math.ceil(document.documentElement.scrollHeight) })).observe(document.body);

  request('ui/initialize', { appInfo: { name: 'wise-card', version: '0.3.0' }, appCapabilities: {}, protocolVersion: '2026-01-26' })
    .then((r) => { hostCaps = r?.hostCapabilities || {}; applyContext(r?.hostContext); notify('ui/notifications/initialized', {}); })
    .catch(() => {});

  // ---- Rendering ----
  // tone: green (allowed / sent), yellow (waiting for you), red (blocked / no access), grey.
  const header = (tone = 'green', label = 'Agent Pass') => `<div class="band ${tone}">
      <div class="brand">
        <img class="logo forest" data-fb="logo" src="${ASSETS.logoForest}" alt="Wise" />
        <span class="chip">${esc(label)}</span>
      </div>
    </div>`;
  const foot = '<div class="mock">Demo · mock money</div>';
  const bullet = (kind, html) =>
    kind === 'warn'
      ? `<div class="bullet"><span class="warn-icon">!</span><p>${html}</p></div>`
      : `<div class="bullet ${kind === 'neg' ? 'neg' : ''}"><img data-fb="${kind === 'neg' ? 'neg' : 'pos'}" src="${kind === 'neg' ? ASSETS.neg : ASSETS.pos}" width="20" height="20" alt="" /><p>${html}</p></div>`;

  function renderLoading(args) {
    if (args && args.recipientId) {
      root.innerHTML = header('grey', 'Payment') + `<div class="skeleton"><span class="pulse"></span> Checking ${esc(fmt(args.amount, args.currency))} to ${esc(args.recipientId)} against your Agent Pass…</div>`;
    }
  }

  const STATUS = {
    ready: ['ok', 'Allowed'],
    paid: ['ok', '✓ Sent'],
    awaiting_user: ['wait', 'Needs your approval'],
    declined: ['no', '✕ Declined'],
    blocked: ['no', '✕ Blocked'],
    expired: ['no', '⏱ Expired'],
  };

  // Stepper: Prepared · Pass · You (or Auto) · Sent  (0..3)
  function stepper(s) {
    const needsYou = s.status === 'awaiting_user' || s.status === 'declined' || s.status === 'expired' || s.sentByUser;
    let at = 1, fail = false;
    const lab = ['done', 'done', '', ''];
    if (s.status === 'ready') { at = 1; lab[1] = 'current'; }
    if (s.status === 'awaiting_user') { at = 2; lab[2] = 'current'; }
    if (s.status === 'paid') { at = 3; lab[2] = 'done'; lab[3] = 'current'; }
    if (s.status === 'blocked') { fail = true; at = 1; lab[1] = 'fail'; }
    if (s.status === 'declined' || s.status === 'expired') { fail = true; at = 2; lab[2] = 'fail'; }
    const pct = (at / 3) * 100;
    const youLabel = needsYou ? 'You' : 'Auto';
    return `<div class="stepper">
      <div class="track">
        <div class="progress ${fail ? 'fail' : ''}" style="width:${pct}%"></div>
        ${fail ? `<span class="dot fail" style="left:${pct}%"></span>` : `<img class="dot" data-fb="dot" src="${ASSETS.dot}" width="8" height="8" alt="" style="left:${pct}%" />`}
      </div>
      <div class="labels"><span class="${lab[0]}">Prepared</span><span class="${lab[1]}">Pass</span><span class="${lab[2]}">${youLabel}</span><span class="${lab[3]}">Sent</span></div>
    </div>`;
  }

  let pollTimer = null;
  function render(s, raw) {
    if (!s) {
      const t = raw?.content?.find?.((c) => c.type === 'text')?.text;
      root.innerHTML = header() + `<div class="bullets">${bullet('neg', esc(t || 'No details.'))}</div>`;
      return;
    }
    if (s.kind === 'balances') return renderBalances(s);
    if (s.kind === 'quote') return renderQuote(s);
    if (s.kind === 'recipients') return renderRecipients(s);
    if (s.kind === 'payment') return renderPayment(s);
    if (s.kind === 'approvals') return renderApprovals(s);
    if (s.kind === 'denied') return renderDenied(s);
    if (s.kind === 'invoices') return renderInvoices(s);
    if (s.kind === 'batch') return renderBatch(s);
    if (s.kind === 'recipient_added') return renderRecipientAdded(s);
  }

  // A read Claude isn't allowed to do (access revoked, or the permission is None).
  function renderDenied(s) {
    if (s.connect) {
      root.innerHTML = header('grey', 'Connect') + `<div class="pair"><img data-fb="hide" src="${ASSETS.claude}" alt="" /><span><img data-fb="hide" src="${ASSETS.wiseFlag}" alt="" /></span></div>
        <h3 class="title-sub" style="text-align:center">Connect your Wise account</h3>
        <div class="bullets">${bullet('warn', esc(s.error))}
          ${bullet('pos', '<strong>You choose what Claude can do</strong>: read-only, or a custom Agent Pass with your own limits.')}
          ${bullet('pos', '<strong>Claude never sees your password.</strong> You approve the connection in the Wise app.')}</div>
        <button class="btn" data-act="open">Connect in Wise app</button>${foot}`;
      return;
    }
    root.innerHTML = header('red') + `<h3 class="title-sub">No access</h3>
      <div class="bullets">${bullet('neg', esc(s.error))}${bullet('pos', '<strong>Only you</strong> decide what Claude can see, in the Wise app.')}</div>
      <button class="btn" data-act="open">Open Wise app</button>`;
  }

  // get_pending_approvals: payments waiting for the user.
  function renderApprovals(s) {
    const rows = s.pending.map((d) => `<div class="row" style="margin-top:12px">${avatar(d.recipient, d.country)}
        <div class="meta"><b>${esc(d.recipient)} · ${fmt(d.amount, d.currency)}</b><small>${esc(d.reason)}</small></div></div>`).join('');
    root.innerHTML = header(s.pending.length ? 'yellow' : 'green', 'Approvals') + `<h3 class="title-sub">${s.pending.length ? 'Waiting for you' : 'Nothing waiting'}</h3>` +
      (rows || `<div class="bullets">${bullet('pos', 'No payments need your approval.')}</div>`) +
      (s.pending.length ? `<div class="bullets">${bullet('pos', "<strong>Claude can't approve these.</strong> Approve or decline them in the Wise app.")}</div><button class="btn" data-act="open">Review in Wise app</button>` : '');
  }

  function renderPayment(s) {
    if (!s.status) {
      root.innerHTML = header('red') + `<div class="status no">✕ Not sent</div><div class="bullets">${bullet('neg', esc(s.error))}</div>`;
      return;
    }
    const draftOnly = s.rule === 'pass.draft'; // within the rules; waiting only because the pass is Draft
    const readOnly = s.rule === 'pass.transfers_read_only';
    let [cls, label] = STATUS[s.status] || ['wait', s.status];
    if (s.status === 'awaiting_user' && draftOnly) label = 'Ready for you to send';
    const eyebrow = {
      ready: 'Claude prepared',
      paid: s.sentByUser ? 'You sent' : 'Claude sent',
      awaiting_user: draftOnly ? 'Claude prepared' : 'Claude wants to send',
      declined: 'You declined',
      expired: 'Not answered in time',
      blocked: 'Claude tried to send',
    }[s.status] || 'Payment';

    const bullets = [];
    if (s.status === 'paid' && s.sentByUser) bullets.push(bullet('pos', '<strong>You approved and sent this</strong> in the Wise app.'));
    else if (s.status === 'ready' || s.status === 'paid') bullets.push(bullet('pos', esc(s.reason)));
    else if (s.status === 'awaiting_user') bullets.push(bullet('warn', esc(s.reason)));
    else bullets.push(bullet('neg', esc(s.reason)));
    (s.warnings || []).forEach((w) => bullets.push(bullet('neg', `<strong>Possible prompt injection.</strong> ${esc(w)}`)));
    if (s.status === 'awaiting_user') bullets.push(bullet('pos', draftOnly ? '<strong>One tap in the Wise app</strong> sends it.' : `<strong>Claude can't approve this.</strong> Only you can, in the Wise app.`));
    if (s.status === 'blocked' || s.status === 'declined') bullets.push(bullet('pos', `<strong>No money moved.</strong> Claude won't retry this payment.`));
    if (s.status === 'expired') bullets.push(bullet('neg', '<strong>Expired after 5 minutes</strong> without your answer. No money moved.'));
    if (s.status === 'awaiting_user') bullets.push(bullet('warn', `<strong>Waiting for you</strong> for <span data-expires="${Date.parse(s.expiresAt || 0)}">5:00</span> more.`));
    if (s.fraud) bullets.push(s.fraud.level === 'low'
      ? bullet('pos', '<strong>Fraud check: low risk.</strong> Nothing unusual.')
      : bullet(s.fraud.level === 'high' ? 'neg' : 'warn', `<strong>Fraud check: ${esc(s.fraud.level)} risk.</strong> ${esc(s.fraud.signals.join('. '))}.`));
    if (s.status === 'paid' && s.balanceLeft != null) bullets.push(bullet('pos', `<strong>${fmt(s.balanceLeft, s.currency)}</strong> ${esc(s.currency)} balance left.`));

    let action = '';
    if (s.status === 'awaiting_user') action = `<button class="btn" data-act="open">${draftOnly ? 'Send in Wise app' : 'Review in Wise app'}</button><div class="foot">This card updates when you decide.</div>`;
    if (readOnly) action = `<button class="btn" data-act="open">Change permissions in Wise app</button>`;

    const note = s.note ? ' · ' + esc(s.note.slice(0, 48)) + (s.note.length > 48 ? '…' : '') : '';
    root.innerHTML = header({ ok: 'green', wait: 'yellow', no: 'red' }[cls] || 'grey', 'Payment') + `
      <div class="eyebrow">${eyebrow}</div>
      <div class="hero">
        <div>
          <div class="amount">${fmt(s.amount, s.currency)}<span class="ccy">${esc(s.currency)}</span></div>
          ${s.amountEUR != null && s.currency !== 'EUR' ? `<div class="sub-eur">≈ ${fmt(s.amountEUR, 'EUR')}</div>` : ''}
        </div>
        <span class="status ${cls}">${label}</span>
      </div>
      <div class="row">${avatar(s.recipient, s.country)}
        <div class="meta"><b>${esc(s.recipient)}</b><small>${esc(s.ibanMasked || 'New recipient')}${note}</small></div></div>
      ${stepper(s)}
      <div class="bullets">${bullets.join('')}</div>
      ${action}${foot}`;
    watch(s);
  }

  // While a payment or batch waits for the user, ask the server every 2 seconds, so the card
  // updates by itself when they approve, decline, or let it expire. Stops if the host refuses.
  function watch(s, isBatch) {
    clearInterval(pollTimer);
    if (s.status !== 'awaiting_user') return;
    const args = isBatch ? { batchId: s.batchId } : { draftId: s.draftId };
    const started = Date.now();
    pollTimer = setInterval(async () => {
      if (Date.now() - started > 6 * 60 * 1000) return clearInterval(pollTimer);
      try {
        const r = await request('tools/call', { name: 'payment_status', arguments: args });
        const next = r?.structuredContent;
        if (next && next.status !== 'awaiting_user') {
          clearInterval(pollTimer);
          isBatch ? renderBatch(next) : renderPayment(next);
        }
      } catch { clearInterval(pollTimer); }
    }, 2000);
  }

  // Countdown chips ("4:12") for the 5-minute approval window.
  setInterval(() => document.querySelectorAll('[data-expires]').forEach((el) => {
    const sec = Math.max(0, Math.round((Number(el.dataset.expires) - Date.now()) / 1000));
    el.textContent = `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}`;
  }), 1000);

  function renderBalances(s) {
    const totalEUR = Object.entries(s.balances).reduce((t, [c, a]) => t + a / (RATES_PER_EUR[c] || 1), 0);
    root.innerHTML = header('green', 'Balances') + `<h3 class="title-sub">Your balances</h3>` +
      Object.entries(s.balances).map(([c, a]) => `<div class="bal"><span class="ccy-row">${ccyDot(c)}${esc(c)}</span><span class="amt">${fmt(a, c)}</span></div>`).join('') +
      `<div class="total"><span>Total, at mock rates</span><b>≈ ${fmt(Math.round(totalEUR * 100) / 100, 'EUR')}</b></div>` + foot;
  }

  function renderQuote(s) {
    const fee = s.fee ? `${num(s.fee, s.feeCurrency)} ${esc(s.feeCurrency)}` : `0 ${esc(s.fromCurrency)}`;
    root.innerHTML = header('grey', 'Quote') + `<h3 class="title-sub">Quote</h3>
      <div class="label">Recipient gets</div>
      <div class="money"><span class="amt">${num(s.recipientGets, s.toCurrency)}</span><span class="ccy-row">${ccyDot(s.toCurrency)}${esc(s.toCurrency)}</span></div>
      <div class="fee"><span class="left"><img data-fb="minus" src="${ASSETS.minus}" width="24" height="24" alt="minus" />${fee}</span><span class="link">Fee</span></div>
      <div class="label indent" style="margin-bottom:0">You send</div>
      <div class="indent" style="font-weight:600">${num(s.amount, s.fromCurrency)} ${esc(s.fromCurrency)}</div>
      <div class="bullets">${bullet('pos', `<strong>Mid-market rate</strong> 1 ${esc(s.fromCurrency)} = ${esc(s.midMarketRate)} ${esc(s.toCurrency)} (mock)`)}</div>${foot}`;
  }

  // check_invoices: unpaid invoices from the (mock) email inbox.
  function renderInvoices(s) {
    const rows = s.invoices.map((i) => `<div class="row" style="margin-top:12px">${avatar(i.vendor, i.iban)}
        <div class="meta"><b>${esc(i.vendor)} · ${fmt(i.amount, i.currency)}</b>
        <small>${esc(i.subject)} · due ${esc(i.due)}${i.savedRecipient ? '' : ' · not a saved recipient'}</small></div></div>`).join('');
    root.innerHTML = header('grey', 'Email') + `<h3 class="title-sub">${s.invoices.length ? `${s.invoices.length} unpaid invoice${s.invoices.length === 1 ? '' : 's'}` : 'No unpaid invoices'}</h3>` +
      rows + `<div class="bullets">${bullet('pos', '<strong>Read-only.</strong> Paying them is checked against your Agent Pass.')}</div>${foot}`;
  }

  // prepare_batch: several payments waiting for one tap.
  function renderBatch(s) {
    const waiting = s.items.filter((d) => d.status === 'awaiting_user');
    const totals = {};
    waiting.forEach((d) => { totals[d.currency] = (totals[d.currency] || 0) + d.amount; });
    const total = Object.entries(totals).map(([c, a]) => fmt(Math.round(a * 100) / 100, c)).join(' + ') || '–';
    const rows = s.items.map((d) => `<div class="row" style="margin-top:12px;${d.status === 'blocked' ? 'opacity:.55' : ''}">${avatar(d.recipient, d.country)}
        <div class="meta"><b>${esc(d.recipient)} · ${fmt(d.amount, d.currency)}</b><small>${d.status === 'blocked' ? 'Blocked: ' : ''}${esc(d.ibanMasked || 'New recipient')} · ${esc(d.reason)}</small></div></div>`).join('');
    const warn = s.items.some((d) => (d.warnings || []).length || /^hard_stop/.test(d.rule));
    const done = s.status === 'paid', gone = s.status === 'declined' || s.status === 'expired';
    const paid = s.items.filter((d) => d.status === 'paid');
    const paidTotals = {};
    paid.forEach((d) => { paidTotals[d.currency] = (paidTotals[d.currency] || 0) + d.amount; });
    if (done || gone) {
      const sum = Object.entries(paidTotals).map(([c, a]) => fmt(Math.round(a * 100) / 100, c)).join(' + ') || '–';
      root.innerHTML = header(done ? 'green' : 'red', 'Batch') + `
        <div class="eyebrow">${done ? 'You paid' : s.status === 'expired' ? 'Not answered in time' : 'You declined'}</div>
        <div class="hero"><div><div class="amount" style="font-size:30px">${done ? esc(sum) : '–'}</div><div class="sub-eur">${esc(s.title)}</div></div>
          <span class="status ${done ? 'ok' : 'no'}">${done ? `✓ ${paid.length} sent` : s.status === 'expired' ? '⏱ Expired' : '✕ Declined'}</span></div>
        ${s.items.map((d) => `<div class="row" style="margin-top:12px;${d.status === 'paid' ? '' : 'opacity:.55'}">${avatar(d.recipient, d.country)}
          <div class="meta"><b>${esc(d.recipient)} · ${fmt(d.amount, d.currency)}</b><small>${{ paid: '✓ Sent', declined: 'Not paid', blocked: 'Blocked', expired: 'Expired' }[d.status] || esc(d.status)}${d.status === 'paid' ? ' · ' + esc(d.ibanMasked || '') : ''}</small></div></div>`).join('')}
        <div class="bullets">${done ? bullet('pos', '<strong>Confirmed with your ID</strong> in the Wise app.') : bullet('pos', '<strong>No money moved.</strong>')}</div>${foot}`;
      return;
    }
    root.innerHTML = header(waiting.length ? 'yellow' : 'red', 'Batch') + `
      <div class="eyebrow">Claude prepared ${s.items.length} payments</div>
      <div class="hero"><div><div class="amount" style="font-size:30px">${esc(total)}</div><div class="sub-eur">${esc(s.title)}</div></div>
        <span class="status ${waiting.length ? 'wait' : 'no'}">${waiting.length ? `${waiting.length} waiting for you` : 'Blocked'}</span></div>
      ${rows}
      <div class="bullets">
        ${bullet('pos', '<strong>One tap pays them all</strong>, after your fingerprint, Wise app or SMS code.')}
        ${s.expiresAt ? bullet('warn', `<strong>Waiting for you</strong> for <span data-expires="${Date.parse(s.expiresAt)}">5:00</span> more.`) : ''}
        ${s.items.some((d) => d.fraud && d.fraud.level !== 'low') ? bullet('warn', '<strong>Fraud check</strong> flagged some payments. Check them in the Wise app.') : ''}
        ${warn ? bullet('warn', 'Some payments have new or changed bank details. They start unticked.') : ''}
        ${bullet('pos', "<strong>Claude can't confirm this batch.</strong> Only you can.")}
      </div>
      ${waiting.length ? '<button class="btn" data-act="open">Review in Wise app</button><div class="foot">This card updates when you decide.</div>' : ''}${foot}`;
    watch(s, true);
  }

  // add_recipient
  function renderRecipientAdded(s) {
    const r = s.recipient;
    root.innerHTML = header('grey', 'Recipients') + `<h3 class="title-sub">New recipient added</h3>
      <div class="row">${avatar(r.name, r.country)}<div class="meta"><b>${esc(r.name)}</b><small>${r.note ? esc(r.note) + ' · ' : ''}${esc(r.currency)} · ${esc(r.iban)}</small></div></div>
      <div class="bullets">${bullet('warn', '<strong>Claude always asks you</strong> before paying a new recipient.')}
        ${bullet('pos', 'You can remove them or turn on auto-pay in the Wise app.')}</div>${foot}`;
  }

  function renderRecipients(s) {
    root.innerHTML = header('grey', 'Recipients') + `<h3 class="title-sub">Saved recipients</h3>` +
      s.recipients.map((r) => `<div class="row" style="margin-top:12px">${avatar(r.name, r.country)}<div class="meta"><b>${esc(r.name)}</b><small>${r.note ? esc(r.note) + ' · ' : ''}${esc(r.currency)} · ${esc(r.iban)}</small></div></div>`).join('') +
      `<div class="bullets">${bullet('pos', `<strong>Only you</strong> can add or change recipients, in the Wise app.`)}</div>`;
  }

  document.addEventListener('click', (e) => {
    const b = e.target.closest('[data-act]');
    if (!b) return;
    if (b.dataset.act === 'open') request('ui/open-link', { url: WISE_APP_URL }).catch(() => {});
  });
})();
</script>
</body>
</html>
