<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Wise · AI Mandate</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
<div class="topbar">
  <header>
    <div class="brand"><img class="logo" src="/assets/wise-logo-forest.svg" alt="Wise" /><span id="conn" class="chip">AI Mandate</span></div>
    <div class="header-right">
      <span class="icon-btn"><img src="/assets/bell.svg" width="24" height="24" alt="Notifications" /></span>
      <img class="avatar-img" src="/assets/avatar.png" alt="Your profile" />
    </div>
  </header>
</div>

<main class="page">
  <div id="offline" class="offline">Can't reach the Wise MCP server. Is it running?</div>

  <div class="hero">
    <div>
      <h1 class="title-screen">AI Mandate</h1>
      <p class="subtitle">The agent has power. Your Mandate has authority.</p>
    </div>
  </div>

  <div class="layout">
    <div class="col col-main">
      <section id="sec-approvals">
        <div class="section-head"><h2 class="title-section">Needs your approval</h2><span id="pending-count"></span></div>
        <div id="approvals-wrap"></div>
      </section>
      <section id="sec-activity">
        <div class="section-head"><h2 class="title-section">Activity</h2></div>
        <div id="activity"></div>
      </section>
    </div>
    <div class="col col-side">
      <section id="sec-balances">
        <div class="section-head"><h2 class="title-section">Balances</h2></div>
        <div id="balances" class="cards"></div>
      </section>
      <section id="sec-mandate">
        <div class="section-head"><h2 class="title-section">Your Mandate</h2><span id="mandate-badge" class="chip">Active</span></div>
        <div id="mandate"></div>
      </section>
    </div>
  </div>

  <footer>Demo with mock money. Not affiliated with or endorsed by Wise. · <button id="reset">Reset demo</button></footer>
</main>

<script src="/app.js"></script>
</body>
</html>
