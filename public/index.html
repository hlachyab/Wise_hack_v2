<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Wise · AI Mandate</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  /* Tokens from the WiseStart Hackathon Figma kit (Palette, Typography, Home / Transactions screens). */
  :root {
    --bright-green: #9FE870;   /* primary/bright green · interactive/accent */
    --accent-hover: #80E142;
    --forest: #163300;         /* primary/forest green · interactive/primary · content/link */
    --content-primary: #0E0F0C;
    --content-secondary: #454745;
    --content-tertiary: #6A6C6A;
    --interactive-secondary: #868685;
    --neutral: rgba(22, 51, 0, 0.08);        /* Card Buttons / Icon Button background */
    --neutral-strong: rgba(22, 51, 0, 0.14); /* Tab track */
    --border-soft: rgba(14, 15, 12, 0.12);   /* Chip / Navbar border */
    --screen: #FFFFFF;                       /* background/screen */
    --positive: #2F5711;
    --warning: #EDC843;
    --warning-ink: #5C4A00;
    --warning-soft: rgba(237, 200, 67, 0.28);
    --negative: #A8200D;                     /* sentiment/negative */
    --negative-hover: #8E1B0B;
    --negative-soft: rgba(168, 32, 13, 0.10);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 14px; line-height: 22px; letter-spacing: 0.01em; /* Body default */
    color: var(--content-primary);
    background: var(--screen);
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  /* Top bar (from the Figma Home header: wordmark · Chip Button · Icon Button · avatar) */
  .topbar { border-bottom: 1px solid var(--border-soft); background: var(--screen); position: sticky; top: 0; z-index: 5; }
  header { max-width: 1200px; margin: 0 auto; padding: 16px 32px; display: flex; align-items: center; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .logo { height: 24px; width: auto; display: block; }
  .flag-img { border-radius: 50%; display: block; flex-shrink: 0; box-shadow: 0 0 0 1px var(--border-soft); }
  .icon-btn { position: relative; }
  .icon-btn .badge { position: absolute; right: -4px; bottom: -4px; width: 18px; height: 18px; border-radius: 50%; box-shadow: 0 0 0 2px var(--screen); }

  .page { max-width: 1200px; margin: 0 auto; padding: 0 32px 48px; }
  .hero { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; flex-wrap: wrap; }
  .layout { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr); gap: 56px; align-items: start; }
  .col { min-width: 0; }
  @media (max-width: 900px) {
    header, .page { padding-left: 16px; padding-right: 16px; }
    .layout { grid-template-columns: 1fr; gap: 0; }
    .col-main, .col-side { display: contents; }
    #sec-approvals { order: 1; } #sec-balances { order: 2; } #sec-mandate { order: 3; } #sec-activity { order: 4; }
    .layout { display: flex; flex-direction: column; align-items: stretch; }
  }
  .avatar-img { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; display: block; }
  .header-right { display: flex; align-items: center; gap: 16px; }
  .chip { display: inline-flex; align-items: center; padding: 5px 16px; border-radius: 100px; background: var(--bright-green); color: var(--forest); font-weight: 600; font-size: 14px; letter-spacing: 0.0125em; white-space: nowrap; }
  .chip.off { background: var(--negative-soft); color: var(--negative); }
  .chip-outline { display: inline-flex; align-items: center; padding: 5px 16px; border-radius: 100px; background: var(--screen); border: 1px solid var(--border-soft); color: var(--forest); font-weight: 600; font-size: 14px; }
  .chip-outline.selected { border-color: var(--forest); }
  .icon-btn { width: 48px; height: 48px; border-radius: 100px; background: var(--neutral); display: grid; place-items: center; flex-shrink: 0; }
  .icon-btn img { width: 24px; height: 24px; display: block; }
  .icon-btn.glyph { font-size: 18px; font-weight: 700; color: var(--content-primary); }
  .icon-btn.no { background: var(--negative-soft); color: var(--negative); }
  .icon-btn.wait { background: var(--warning-soft); color: var(--warning-ink); }
  .icon-btn.ok { background: var(--bright-green); color: var(--forest); }

  /* Type scale */
  .title-screen { font-size: 30px; line-height: 34px; font-weight: 600; letter-spacing: -0.025em; margin: 32px 0 8px; }
  .subtitle { color: var(--content-secondary); margin: 0 0 8px; }
  .section-head { display: flex; align-items: center; justify-content: space-between; margin: 36px 0 16px; }
  .title-section { font-size: 26px; line-height: 32px; font-weight: 600; letter-spacing: -0.015em; margin: 0; }
  .title-sub { font-size: 22px; line-height: 28px; font-weight: 600; letter-spacing: -0.015em; margin: 0; }
  .label { color: var(--content-secondary); margin-bottom: 8px; }

  /* Buttons (Figma "Button": 48px pill, Inter SemiBold 14) */
  .btn { display: flex; align-items: center; justify-content: center; height: 48px; border: 0; border-radius: 50px; padding: 0 20px; font: inherit; font-weight: 600; font-size: 14px; letter-spacing: 0.0125em; cursor: pointer; flex: 1; transition: background .15s; }
  .btn-primary { background: var(--bright-green); color: var(--forest); }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-secondary { background: var(--screen); color: var(--forest); box-shadow: inset 0 0 0 1px var(--forest); }
  .btn-secondary:hover { background: var(--neutral); }
  .btn-danger { background: var(--negative); color: #fff; width: 100%; }
  .btn-danger:hover { background: var(--negative-hover); }
  .btn-row { display: flex; gap: 8px; margin-top: 16px; }
  .link-btn { background: none; border: 0; padding: 4px 8px; font: inherit; font-size: 16px; line-height: 24px; font-weight: 600; color: var(--forest); text-decoration: underline; text-underline-offset: 4px; cursor: pointer; }

  /* Approval card */
  .approval { border: 1px solid var(--warning); background: var(--screen); border-radius: 16px; padding: 16px; margin-bottom: 12px; }
  .approval.new { animation: pop .35s ease-out; }
  @keyframes pop { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }
  .eyebrow { display: inline-flex; align-items: center; gap: 8px; padding: 5px 12px; border-radius: 100px; background: var(--warning-soft); color: var(--warning-ink); font-weight: 600; font-size: 13px; margin-bottom: 12px; }
  .money { border: 1px solid var(--interactive-secondary); border-radius: 10px; min-height: 64px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 4px; }
  .money .amt { font-size: 18px; line-height: 24px; font-weight: 600; letter-spacing: -0.01em; }
  .money .ccy { display: flex; align-items: center; gap: 8px; font-size: 16px; line-height: 24px; }
  .money .eur { color: var(--content-secondary); font-size: 14px; }
  .ccy-dot { width: 24px; height: 24px; border-radius: 50%; background: var(--forest); color: var(--bright-green); display: grid; place-items: center; font-size: 12px; font-weight: 700; flex-shrink: 0; }
  .panel { background: var(--neutral); border-radius: 16px; padding: 16px; margin-top: 12px; }
  .warn { background: var(--warning-soft); color: var(--warning-ink); border-radius: 16px; padding: 12px 16px; margin-top: 8px; font-weight: 500; }
  .note { font-size: 13px; line-height: 20px; color: var(--content-secondary); margin-top: 8px; word-break: break-word; }
  .rule { display: inline-block; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; line-height: 16px; padding: 3px 10px; border-radius: 100px; background: var(--neutral); color: var(--content-secondary); }
  .approval .rule { margin-top: 12px; }

  /* Transaction-style rows (Figma "Transaction Buttons") */
  .tx { display: flex; align-items: flex-start; gap: 16px; padding: 16px 12px; border-radius: 10px; }
  .tx .meta { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .tx .meta b { font-size: 16px; line-height: 24px; font-weight: 600; letter-spacing: 0.005em; }
  .tx .meta small { font-size: 14px; line-height: 22px; color: var(--content-secondary); }
  .tx .meta p { margin: 0; font-size: 13px; line-height: 20px; color: var(--content-secondary); }
  .tx .meta .rule { align-self: flex-start; }
  .tx .head { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
  .tx .amount { font-size: 16px; line-height: 24px; font-weight: 600; white-space: nowrap; text-align: right; }
  .tx .amount.muted { color: var(--content-tertiary); text-decoration: line-through; }
  .initials { font-weight: 600; font-size: 16px; }

  /* Balances (Figma "Card Buttons": 16px radius, neutral bg) */
  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .card-btn { min-width: 0; height: 148px; background: var(--neutral); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; justify-content: space-between; transition: background .6s; }
  .card-btn.flash { background: rgba(159, 232, 112, 0.55); }
  .ccy-circle { width: 48px; height: 48px; border-radius: 50%; border: 1.333px solid var(--border-soft); background: var(--forest); color: var(--bright-green); display: grid; place-items: center; font-size: 20px; font-weight: 700; }
  .card-btn .ccy-circle { width: 40px; height: 40px; font-size: 17px; }
  .card-btn b { display: block; font-size: 20px; overflow: hidden; text-overflow: ellipsis; line-height: 28px; font-weight: 600; letter-spacing: -0.015em; }
  .card-btn small { color: var(--content-secondary); font-size: 14px; }

  /* Mandate */
  .limits { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .limit { background: var(--neutral); border-radius: 16px; padding: 16px; }
  .limit small { display: block; color: var(--content-secondary); }
  .limit b { font-size: 22px; line-height: 28px; font-weight: 600; letter-spacing: -0.015em; }
  .spend { margin-top: 20px; }
  .bar-label { display: flex; justify-content: space-between; margin-bottom: 8px; }
  .bar-label span:first-child { font-weight: 600; }
  .bar-label span:last-child { color: var(--content-secondary); }
  .bar { height: 8px; background: var(--neutral-strong); border-radius: 100px; overflow: hidden; }
  .bar > div { height: 100%; background: var(--forest); border-radius: 100px; transition: width .5s ease; }
  .group-title { font-size: 16px; line-height: 24px; font-weight: 600; margin: 24px 0 4px; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .revoked-banner { background: var(--negative-soft); color: var(--negative); border-radius: 16px; padding: 12px 16px; font-weight: 600; margin-top: 16px; }
  .mandate-actions { margin-top: 20px; display: flex; }

  .empty { display: flex; align-items: center; gap: 16px; color: var(--content-secondary); font-weight: 600; font-size: 16px; padding: 8px 0; }
  .divider { height: 1px; background: var(--border-soft); margin: 0; border: 0; }
  footer { text-align: center; margin-top: 32px; font-size: 12px; line-height: 18px; color: var(--content-tertiary); }
  footer button { background: none; border: 0; color: var(--forest); font: inherit; font-weight: 600; text-decoration: underline; cursor: pointer; }
  .offline { background: var(--negative-soft); color: var(--negative); border-radius: 16px; padding: 12px 16px; font-weight: 600; margin-top: 16px; display: none; }
</style>
</head>
<body>
<div class="topbar">
  <header>
    <div class="brand"><img class="logo" src="/assets/wise-logo-forest.svg" alt="Wise" /><span id="conn" class="chip">AI Mandate</span></div>
    <div class="header-right">
      <span class="icon-btn"><img src="/assets/bell.svg" width="24" height="24" alt="Notifications" /></span>
      <img class="avatar-img" src="/assets/avatar.png" alt="Your profile" />
    </div>
  </header>
</div>

<main class="page">
  <div id="offline" class="offline">Can't reach the Wise MCP server. Is it running?</div>

  <div class="hero">
    <div>
      <h1 class="title-screen">AI Mandate</h1>
      <p class="subtitle">The agent has power. Your Mandate has authority.</p>
    </div>
  </div>

  <div class="layout">
    <div class="col col-main">
      <section id="sec-approvals">
        <div class="section-head"><h2 class="title-section">Needs your approval</h2><span id="pending-count"></span></div>
        <div id="approvals-wrap"></div>
      </section>
      <section id="sec-activity">
        <div class="section-head"><h2 class="title-section">Activity</h2></div>
        <div id="activity"></div>
      </section>
    </div>
    <div class="col col-side">
      <section id="sec-balances">
        <div class="section-head"><h2 class="title-section">Balances</h2></div>
        <div id="balances" class="cards"></div>
      </section>
      <section id="sec-mandate">
        <div class="section-head"><h2 class="title-section">Your Mandate</h2><span id="mandate-badge" class="chip">Active</span></div>
        <div id="mandate"></div>
      </section>
    </div>
  </div>

  <footer>Demo with mock money. Not affiliated with or endorsed by Wise. · <button id="reset">Reset demo</button></footer>
</main>

<script>
  const SYMBOLS = { EUR: '€', GBP: '£', JPY: '¥' };
  const NAMES = { EUR: 'Euro', GBP: 'British Pound', JPY: 'Japanese Yen' };
  // Flags from the Figma "Flags" section (EU flag not exported yet → symbol fallback until public/assets/flag-eu.png exists)
  const FLAGS = { GBP: "/assets/flag-gb.png", JPY: "/assets/flag-jp.png" };
  const COUNTRY = { EE: "/assets/flag-ee.png", JP: "/assets/flag-jp.png", GB: "/assets/flag-gb.png" };
  fetch("/assets/flag-eu.png", { method: "HEAD" }).then((r) => { if (r.ok) { FLAGS.EUR = "/assets/flag-eu.png"; last = ""; } }).catch(() => {});
  const flagOr = (c, size, fallback) => FLAGS[c] ? `<img class="flag-img" src="${FLAGS[c]}" width="${size}" height="${size}" alt="${esc(c)} flag" />` : fallback;
  const flagBadge = (cc) => COUNTRY[cc] ? `<img class="badge" src="${COUNTRY[cc]}" width="20" height="20" alt="" />` : "";
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const num = (a, c) => {
    const d = c === 'JPY' || Number.isInteger(Number(a)) ? 0 : 2;
    return Number(a).toLocaleString('en-GB', { minimumFractionDigits: d, maximumFractionDigits: d });
  };
  const fmt = (a, c) => (SYMBOLS[c] || '') + num(a, c) + (SYMBOLS[c] ? '' : ' ' + esc(c));
  const initials = (n) => String(n).split(/\s+/).map((w) => w[0]).join('').slice(0, 2).toUpperCase();
  const timeAgo = (iso) => {
    const s = Math.round((Date.now() - new Date(iso)) / 1000);
    if (s < 10) return 'Just now';
    if (s < 60) return `${s}s ago`;
    if (s < 3600) return `${Math.floor(s / 60)}m ago`;
    return new Date(iso).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  };

  // Activity row: icon + title + status label
  const ICON_IMG = { arrow: '<img src="/assets/arrow-up.svg" width="24" height="24" alt="" />', plus: '<img src="/assets/plus.svg" width="24" height="24" alt="" />' };
  function activityLook(a) {
    switch (a.kind) {
      case 'paid': return { icon: ICON_IMG.arrow, cls: '', label: 'Sent' };
      case 'approved': return { icon: '✓', cls: 'ok glyph', label: 'Approved by you' };
      case 'declined': return { icon: '✕', cls: 'no glyph', label: 'Declined by you', muted: true };
      case 'blocked': return { icon: '✕', cls: 'no glyph', label: 'Blocked at send time', muted: true };
      case 'revoked': return { icon: '⏻', cls: 'no glyph', label: 'Access revoked' };
      case 'restored': return { icon: '↺', cls: 'glyph', label: 'Access restored' };
      case 'prepared':
        if (a.decision === 'needs_approval') return { icon: '!', cls: 'wait glyph', label: 'Waiting for you' };
        if (a.decision === 'block') return { icon: '✕', cls: 'no glyph', label: 'Blocked', muted: true };
        return { icon: ICON_IMG.plus, cls: '', label: 'Prepared by Claude' };
      default: return { icon: '•', cls: 'glyph', label: '' };
    }
  }

  let last = '';
  const seenApprovals = new Set();
  let firstRender = true; // cards already present on page load appear without animation
  let prevBalances = null;

  function render(s) {
    const draftsById = Object.fromEntries(s.drafts.map((d) => [d.id, d]));

    // 1. Approval cards
    const pending = s.drafts.filter((d) => d.status === 'awaiting_user');
    document.getElementById('pending-count').innerHTML = pending.length ? `<span class="eyebrow" style="margin:0">${pending.length} waiting</span>` : '';
    document.getElementById('approvals-wrap').innerHTML = pending.length
      ? pending.map((d) => `
        <div class="approval ${firstRender || seenApprovals.has(d.id) ? '' : 'new'}">
          <span class="eyebrow">Claude is asking</span>
          <div class="tx" style="padding:0 0 12px">
            <span class="icon-btn"><span class="initials">${esc(initials(d.recipientName))}</span>${flagBadge(d.iban ? d.iban.slice(0, 2) : "")}</span>
            <div class="meta"><b>Claude wants to pay ${esc(d.recipientName)}</b><small>${d.ibanMasked ? 'To account ' + esc(d.ibanMasked) : 'New recipient'}</small></div>
          </div>
          <div class="label">Recipient gets</div>
          <div class="money"><span class="amt">${num(d.amount, d.currency)}</span>
            <span class="ccy">${d.amountEUR != null && d.currency !== 'EUR' ? `<span class="eur">≈ ${fmt(d.amountEUR, 'EUR')}</span>` : ''}${flagOr(d.currency, 24, `<span class="ccy-dot">${esc(SYMBOLS[d.currency] || d.currency[0])}</span>`)}${esc(d.currency)}</span></div>
          <div class="panel">${esc(d.reason)}</div>
          ${d.warnings.map((w) => `<div class="warn">⚠ ${esc(w)}</div>`).join('')}
          ${d.note ? `<div class="note">Note: “${esc(d.note)}”</div>` : ''}
          <span class="rule">${esc(d.rule)}</span>
          <div class="btn-row">
            <button class="btn btn-secondary" data-act="decline" data-id="${esc(d.id)}">Decline</button>
            <button class="btn btn-primary" data-act="approve" data-id="${esc(d.id)}">Approve</button>
          </div>
        </div>`).join('')
      : `<div class="empty"><span class="icon-btn ok glyph">✓</span>Nothing needs your approval. Payments Claude prepares that break a rule will appear here.</div>`;
    pending.forEach((d) => seenApprovals.add(d.id));
    firstRender = false;

    // 3. Balances (rendered before the Mandate on screen, like the Figma Home)
    document.getElementById('balances').innerHTML = Object.entries(s.balances).map(([c, a]) => `
      <div class="card-btn ${prevBalances && prevBalances[c] !== a ? 'flash' : ''}">
        ${flagOr(c, 40, `<span class="ccy-circle">${esc(SYMBOLS[c] || c[0])}</span>`)}
        <div><b>${num(a, c)}</b><small>${esc(NAMES[c] || c)}</small></div>
      </div>`).join('');
    if (prevBalances && Object.keys(s.balances).some((c) => prevBalances[c] !== s.balances[c])) {
      setTimeout(() => document.querySelectorAll('.card-btn.flash').forEach((el) => el.classList.remove('flash')), 900);
    }
    prevBalances = s.balances;

    // 2. Mandate
    const m = s.mandate;
    const pct = Math.min(100, (m.spentThisMonthEUR / m.monthlyLimitEUR) * 100);
    const badge = document.getElementById('mandate-badge');
    badge.textContent = m.revoked ? 'Revoked' : 'Active';
    badge.className = 'chip' + (m.revoked ? ' off' : '');
    const conn = document.getElementById('conn');
    conn.textContent = m.revoked ? 'AI access off' : 'AI Mandate';
    conn.className = 'chip' + (m.revoked ? ' off' : '');

    document.getElementById('mandate').innerHTML = `
      <div class="limits">
        <div class="limit"><small>Per payment</small><b>${fmt(m.perPaymentLimitEUR, 'EUR')}</b></div>
        <div class="limit"><small>Per month</small><b>${fmt(m.monthlyLimitEUR, 'EUR')}</b></div>
      </div>
      <div class="spend">
        <div class="bar-label"><span>${fmt(m.spentThisMonthEUR, 'EUR')} spent this month</span><span>${fmt(Math.max(0, m.monthlyLimitEUR - m.spentThisMonthEUR), 'EUR')} left</span></div>
        <div class="bar"><div style="width:${pct}%"></div></div>
      </div>
      <div class="group-title">Trusted recipients</div>
      ${s.recipients.map((r) => `
        <div class="tx">
          <span class="icon-btn"><span class="initials">${esc(initials(r.name))}</span>${flagBadge(r.country)}</span>
          <div class="meta"><b>${esc(r.name)}</b><small>${esc(r.currency)} · ${esc(r.iban)}</small></div>
        </div>`).join('')}
      <div class="group-title">Allowed currencies</div>
      <div class="chips">${m.allowedCurrencies.map((c) => `<span class="chip-outline selected">${esc(c)}</span>`).join('')}</div>
      ${m.revoked ? `<div class="revoked-banner">Claude's access is revoked. Every new AI payment is blocked.</div>` : ''}
      <div class="mandate-actions">
        ${m.revoked
          ? `<button class="btn btn-primary" data-act="restore">Restore AI access</button>`
          : `<button class="btn btn-danger" data-act="revoke">Revoke AI access</button>`}
      </div>`;

    // 4. Activity
    document.getElementById('activity').innerHTML = s.activity.length
      ? s.activity.map((a) => {
          const look = activityLook(a);
          const d = a.draftId ? draftsById[a.draftId] : null;
          const title = d ? d.recipientName : a.kind === 'revoked' || a.kind === 'restored' ? 'Claude' : 'Wise';
          const amount = d ? `<span class="amount ${look.muted ? 'muted' : ''}">${num(d.amount, d.currency)} ${esc(d.currency)}</span>` : '';
          return `<div class="tx">
            <span class="icon-btn ${look.cls}">${look.icon}</span>
            <div class="meta">
              <div class="head"><b>${esc(title)}</b>${amount}</div>
              <small>${esc(look.label)} · ${timeAgo(a.ts)}</small>
              <p>${esc(a.text)}</p>
              ${a.rule ? `<span class="rule">${esc(a.rule)}</span>` : ''}
            </div>
          </div>`;
        }).join('')
      : `<div class="empty"><span class="icon-btn glyph">·</span>No activity yet. Ask Claude to pay someone.</div>`;
  }

  async function poll() {
    try {
      const res = await fetch('/api/state', { cache: 'no-store' });
      const s = await res.json();
      document.getElementById('offline').style.display = 'none';
      const key = JSON.stringify(s) + Math.floor(Date.now() / 10000); // re-render at least every 10s for "time ago"
      if (key !== last) { last = key; render(s); }
    } catch {
      document.getElementById('offline').style.display = 'block';
    }
  }

  async function post(url) {
    try {
      const res = await fetch(url, { method: 'POST' });
      if (!res.ok) {
        const e = await res.json().catch(() => ({}));
        console.warn(e.error || res.statusText);
      }
    } finally {
      last = '';
      poll();
    }
  }

  document.addEventListener('click', (e) => {
    const b = e.target.closest('[data-act]');
    if (!b) return;
    const { act, id } = b.dataset;
    if (act === 'approve' || act === 'decline') post(`/api/drafts/${encodeURIComponent(id)}/${act}`);
    if (act === 'revoke') post('/api/revoke');
    if (act === 'restore') post('/api/restore');
  });
  document.getElementById('reset').addEventListener('click', () => { prevBalances = null; post('/api/reset'); });

  poll();
  setInterval(poll, 1000);
</script>
</body>
</html>
